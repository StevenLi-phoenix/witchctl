<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无敌号 · 进度</title>
<style>
:root {
  --bg: #0d0b1a; --bg2: #14112a; --card: #1a1636; --line: #2c2650; --ink: #ece8ff; --dim: #8f88b8;
  --gold: #f2c660; --violet: #a98bff; --rose: #ff6f8e; --mint: #5fe3b0; --sky: #6cc4ff;
  --glow: 0 0 0 1px var(--line), 0 12px 40px -18px #000;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f2ff; --bg2: #ebe6ff; --card: #ffffff; --line: #d8d0f5; --ink: #1d1740; --dim: #6b648f;
    --gold: #b5800f; --violet: #6a4bd6; --rose: #d1385c; --mint: #16966a; --sky: #1d78b8;
    --glow: 0 0 0 1px var(--line), 0 12px 30px -20px #6a4bd655;
  }
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: radial-gradient(1200px 600px at 80% -10%, #3a2a7a33, transparent 60%), var(--bg);
  font: 14px/1.5 "PingFang SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif; min-height: 100vh; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { margin: 0; font: 700 28px/1.1 "Songti SC", "Noto Serif SC", serif; letter-spacing: .06em; }
h1 small { display: block; font: 400 12px/1.4 ui-sans-serif, system-ui; color: var(--dim); letter-spacing: .02em; margin-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 99px; background: var(--card); box-shadow: var(--glow); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.dot.on { background: var(--mint); box-shadow: 0 0 10px var(--mint); animation: pulse 1.8s infinite; }
.dot.off { background: var(--rose); }
@keyframes pulse { 50% { opacity: .45; } }
.sp { flex: 1; }
.banner { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; background: #ff6f8e1f; color: var(--rose); box-shadow: 0 0 0 1px #ff6f8e55; }
.grid { display: grid; gap: 14px; grid-template-columns: 340px 1fr; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.col { display: grid; gap: 14px; align-content: start; min-width: 0; }
section { background: var(--card); border-radius: 14px; padding: 16px 18px; box-shadow: var(--glow); min-width: 0; }
h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 7px 0; }
.mark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; box-shadow: 0 0 0 1.5px var(--line) inset; color: var(--dim); }
.done .mark { background: var(--mint); color: #062; box-shadow: none; }
.doing .mark { background: var(--gold); color: #321; box-shadow: 0 0 14px #f2c66088; animation: pulse 1.6s infinite; }
.done .t { color: var(--dim); }
.note { display: block; color: var(--dim); font-size: 12px; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.num { background: var(--bg2); border-radius: 10px; padding: 10px 12px; }
.num b { display: block; font: 700 22px/1.1 ui-rounded, "SF Pro Rounded", ui-sans-serif; font-variant-numeric: tabular-nums; }
.num span { font-size: 11px; color: var(--dim); }
.num.truth b { color: var(--violet); } .num.time b { color: var(--sky); } .num.lv b { color: var(--gold); }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 4px 0; }
.pips { display: flex; gap: 3px; } .pips i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); }
.pips i.f { background: linear-gradient(90deg, var(--violet), var(--gold)); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--bg2); color: var(--dim); }
.chip b { color: var(--ink); font-weight: 600; }
.bar { height: 10px; border-radius: 6px; background: var(--bg2); overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; border-radius: 6px; transition: width .5s; }
.hp i { background: linear-gradient(90deg, #35d39a, #7be8b6); } .foe i { background: linear-gradient(90deg, #ff5d7e, #ff9a6c); }
.unit { padding: 12px 0; border-top: 1px solid var(--line); } .unit:first-child { border-top: 0; padding-top: 0; }
.unit .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.unit .name { font-weight: 600; font-size: 15px; } .unit .hpn { font-variant-numeric: tabular-nums; color: var(--dim); }
.intent { font-size: 12px; color: var(--gold); margin-top: 4px; }
.hand { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; }
.card { flex: 0 0 132px; background: var(--bg2); border-radius: 10px; padding: 8px 10px; box-shadow: 0 0 0 1px var(--line); font-size: 12px; position: relative; }
.card.off { opacity: .45; } .card .c { position: absolute; top: -7px; right: -5px; width: 22px; height: 22px; border-radius: 50%; background: var(--violet); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.card p { margin: 4px 0 0; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.kv div { background: var(--bg2); border-radius: 10px; padding: 8px 12px; } .kv b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; } .kv span { font-size: 11px; color: var(--dim); }
.tl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.feed { height: 360px; overflow-y: auto; font: 12px/1.65 ui-monospace, "SF Mono", Menlo, monospace; scrollbar-width: thin; }
.feed div { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 0 2px; } .feed time { color: var(--dim); }
.feed .play { color: var(--ink); } .feed .act { color: var(--dim); } .feed .win { color: var(--mint); font-weight: 600; }
.feed .skill { color: var(--violet); } .feed .deck, .feed .shop { color: var(--sky); } .feed .turn { color: var(--gold); } .feed .warn { color: var(--rose); }
.empty, .feed .empty { display: block; color: var(--dim); padding: 14px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>无敌号<small id="goal">轻松到可以躺着通关的局外成长</small></h1>
    <span class="sp"></span>
    <span class="pill"><span class="dot" id="dot"></span><span id="conn">连接中…</span></span>
    <span class="pill" id="link"><span class="dot"></span>连接中…</span>
    <span class="pill" id="phase">—</span>
    <span class="pill" id="clock">—</span>
  </header>
  <div id="banner"></div>
  <div class="grid">
    <div class="col">
      <section><h2>任务进度 <span id="tupd"></span></h2><ul class="steps" id="steps"></ul></section>
      <section><h2>局外成长</h2><div id="meta"></div></section>
    </div>
    <div class="col">
      <section><h2>战场 <span id="where"></span></h2><div id="field"></div></section>
      <section><h2>Bot 动态 <span id="counts"></span></h2><div class="feed" id="feed"></div></section>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PHASES = { main_menu: "主菜单", hub: "主城", game_entry: "出发前", map_select: "选路", battle: "战斗", battle_won: "战斗胜利", battle_lost: "战败",
  rewards: "奖励", card_choice: "选牌", blessing_choice: "选祝福", rest: "休息室", event: "事件", run_end: "结算", mode_choice: "选模式",
  announcement: "公告", item_reveal: "获得物品", modal: "确认窗", deck: "牌组", deck_select: "选牌", shop: "商店", outsider_shop: "局外商店", slot: "混沌乐园",
  achievements: "成就", dialogue: "对话", unknown: "切场景中" };
const mmss = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + "h " : "") + m + "m " + (s % 60) + "s"; };
const clock = d => d.toTimeString().slice(0, 8) + "." + String(d.getMilliseconds()).padStart(3, "0");
const pct = (a, b) => b ? Math.max(0, Math.min(100, a / b * 100)) : 0;
const FEED_MAX = 80;

// Everything the page knows. The server pushes changes (SSE); the clock and the "N s ago" labels are counted here.
const S = { game: { reachable: false }, bot: { lines: [], counts: { wins: 0, plays: 0, turns: 0 }, ageS: null, seq: 0 }, tasks: null,
  uptimeS: 0, uptimeAt: Date.now(), botAt: Date.now(), stateAt: null, link: "connecting" };

const last = {};
const put = (id, html) => { if (last[id] !== html) { last[id] = html; $(id).innerHTML = html; } };
const age = at => `<span class="age" data-at="${esc(at)}"></span>`;

function buffs(list) { return list?.length ? `<div class="chips">${list.map(b => `<span class="chip">${esc(b.name)} <b>×${esc(b.level)}</b></span>`).join("")}</div>` : ""; }

function renderField(g) {
  if (!g.reachable) return `<div class="empty">游戏没在运行（桥接 :47800 无响应）</div>`;
  const b = g.battle;
  if (b) {
    const p = b.player, foes = b.enemies.filter(e => e.alive !== false && !e.dead);
    const you = `<div class="unit"><div class="top"><span class="name">${esc(p.name)} <span class="chip">护盾 <b>${esc(p.defend)}</b></span> <span class="chip">魔力 <b>${esc(p.power)}/${esc(p.maxPower)}</b></span></span><span class="hpn">${esc(p.hp)} / ${esc(p.maxHp)}</span></div>
      <div class="bar hp"><i style="width:${pct(p.hp, p.maxHp)}%"></i></div>${buffs(p.buffs)}</div>`;
    const them = foes.map(e => `<div class="unit"><div class="top"><span class="name">${esc(e.name)} <span class="chip">护盾 <b>${esc(e.defend)}</b></span></span><span class="hpn">${esc(e.hp)} / ${esc(e.maxHp)}</span></div>
      <div class="bar foe"><i style="width:${pct(e.hp, e.maxHp)}%"></i></div>${buffs(e.buffs)}
      ${(e.intents || []).map(i => `<div class="intent">▸ ${esc(i.name)} — ${esc(i.text)}</div>`).join("")}</div>`).join("");
    const hand = b.hand.length ? `<div class="hand">${b.hand.map(c => `<div class="card ${c.playable ? "" : "off"}"><span class="c">${esc(c.cost)}</span><b>${esc(c.name)}</b><p>${esc(c.text)}</p></div>`).join("")}</div>` : "";
    const piles = p.piles ? `<div class="chips"><span class="chip">抽牌堆 <b>${esc(p.piles.draw)}</b></span><span class="chip">弃牌堆 <b>${esc(p.piles.discard)}</b></span></div>` : "";
    return you + them + hand + piles;
  }
  const r = g.run;
  const run = r ? `<div class="kv"><div><b>${esc(r.gold)}</b><span>金币</span></div><div><b>${esc(r.inDeck)}</b><span>牌组（${esc(r.minimum)}–${esc(r.maximum)}）</span></div>
      <div><b>${esc(r.backpack)}/${esc(r.backpackMax)}</b><span>背包</span></div><div><b>${esc(r.relics)}/${esc(r.relicSlots)}</b><span>遗物</span></div></div>
      <div class="chips">${Object.entries(r.attributes || {}).map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>
      <div class="chip" style="margin-top:8px">局内数据 · ${age(g.runAt)}</div>` : `<div class="empty">当前不在局内</div>`;
  const tl = (g.phases || []).slice().reverse().map(([t, ph]) => `<span class="chip">${esc(t)} <b>${esc(PHASES[ph] || ph)}</b></span>`).join("");
  return run + `<div class="tl">${tl}</div>`;
}

function renderTasks(t) {
  if (!t) return `<li><span class="mark"></span><span class="t">还没有任务清单</span></li>`;
  if (t.error) return `<li><span class="mark">!</span><span class="t">任务文件读不了：${esc(t.error)}</span></li>`;
  return (t.steps || []).map(s => `<li class="${esc(s.state)}"><span class="mark">${s.state === "done" ? "✓" : s.state === "doing" ? "●" : ""}</span>
    <span class="t">${esc(s.text)}${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}</span></li>`).join("");
}

function renderMeta(g, t) {
  const h = g.hub;
  const nums = h ? `<div class="nums"><div class="num truth"><b>${esc(h.truth)}</b><span>真理结晶</span></div><div class="num time"><b>${esc(h.time)}</b><span>时间</span></div><div class="num lv"><b>Lv ${esc(h.level)}</b><span>${esc(h.runsPlayed)} 局</span></div></div>
    <div class="note" style="margin:-6px 0 10px">在主城读到 · ${age(g.hubAt)}</div>` : `<div class="empty">货币只在主城里能读到</div>`;
  const stats = (t?.meta?.stats || []).map(s => `<div class="stat"><span>${esc(s.name)}</span><span class="pips">${Array.from({ length: s.max }, (_, i) => `<i class="${i < s.level ? "f" : ""}"></i>`).join("")}</span></div>`).join("");
  const extra = (t?.meta?.extras || []).map(x => `<span class="chip"><b>${esc(x.name)}</b>${x.note ? " · " + esc(x.note) : ""}</span>`).join("");
  return nums + stats + (extra ? `<div class="chips">${extra}</div>` : "");
}

function drawGame() {
  const g = S.game;
  $("dot").className = "dot " + (g.reachable ? "on" : "off");
  $("conn").textContent = g.reachable ? "游戏在线" : "游戏离线";
  $("phase").textContent = g.reachable ? (PHASES[g.phase] || g.phase) : "—";
  put("field", renderField(g));
  put("meta", renderMeta(g, S.tasks));
  $("where").textContent = S.stateAt ? "更新 " + clock(S.stateAt) : "";
}
function drawTasks() {
  if (S.tasks?.goal) $("goal").textContent = S.tasks.goal;
  $("tupd").textContent = S.tasks?.updated ? "更新 " + S.tasks.updated : "";
  put("steps", renderTasks(S.tasks));
  put("meta", renderMeta(S.game, S.tasks));
}
function drawBot() {
  const c = S.bot.counts;
  $("counts").textContent = `${c.wins} 胜 · ${c.plays} 张牌 · ${c.turns} 回合`;
  localTick();
}

// A feed line is a DOM node filled with textContent: game text never goes through innerHTML.
function feedNode(l) {
  const row = document.createElement("div"), t = document.createElement("time"), x = document.createElement("span");
  row.className = l.kind; t.textContent = l.t; x.textContent = l.text; row.append(t, x);
  return row;
}
function drawFeed(full) {
  const feed = $("feed"), stick = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 30;
  if (full) {
    feed.replaceChildren(...S.bot.lines.map(feedNode));
    if (!S.bot.lines.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "日志还没有内容"; feed.append(e); }
  }
  if (stick) feed.scrollTop = feed.scrollHeight;
}
function addLines(lines) {
  const fresh = lines.filter(l => l.n > S.bot.seq);       // the snapshot and the events can overlap: line numbers settle it
  if (!fresh.length) return;
  const feed = $("feed"), stick = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 30;
  feed.querySelector(".empty")?.remove();
  for (const l of fresh) feed.append(feedNode(l));
  while (feed.childElementCount > FEED_MAX) feed.firstElementChild.remove();
  S.bot.lines = S.bot.lines.concat(fresh).slice(-FEED_MAX);
  S.bot.seq = fresh[fresh.length - 1].n;
  if (stick) feed.scrollTop = feed.scrollHeight;
}

// Once a second, locally: the clock, the "N s ago" labels, the stall banner.
function localTick() {
  const now = Date.now();
  $("clock").textContent = "面板已开 " + mmss(S.uptimeS + (now - S.uptimeAt) / 1000);
  for (const el of document.querySelectorAll(".age[data-at]")) el.textContent = mmss(now / 1000 - Number(el.dataset.at)) + "前";
  const warn = [], silent = S.bot.ageS == null ? null : S.bot.ageS + (now - S.botAt) / 1000;
  if (silent != null && silent > 120) warn.push(`bot 日志 ${mmss(silent)} 没有新内容（结束了或卡住了）`);
  if (!S.game.reachable) warn.push("桥接无响应：游戏没开，或还在加载");
  if (S.link === "retry") warn.push("与面板服务的实时连接断了，正在重连…");
  put("banner", warn.map(w => `<div class="banner">${esc(w)}</div>`).join(""));
  const link = { live: ["实时", "on"], connecting: ["连接中…", ""], retry: ["重连中…", "off"], poll: ["轮询（浏览器不支持实时流）", ""] }[S.link];
  $("link").innerHTML = `<span class="dot ${link[1]}"></span>${esc(link[0])}`;
}

function applySnapshot(d) {
  S.game = d.game; S.tasks = d.tasks; S.uptimeS = d.uptimeS; S.uptimeAt = Date.now();
  S.bot = { ...d.bot, lines: d.bot.lines }; S.botAt = Date.now(); S.stateAt = new Date();
  drawGame(); drawTasks(); drawBot(); drawFeed(true);
}

if (window.EventSource) {
  const es = new EventSource("/api/stream");              // reconnects by itself; every connection starts with a snapshot
  es.onopen = () => { S.link = "live"; localTick(); };
  es.onerror = () => { S.link = "retry"; localTick(); };
  es.addEventListener("snapshot", e => applySnapshot(JSON.parse(e.data)));
  es.addEventListener("state", e => { S.game = JSON.parse(e.data); S.stateAt = new Date(); drawGame(); });
  es.addEventListener("log", e => { const d = JSON.parse(e.data); addLines(d.lines); S.bot.counts = d.counts; S.bot.ageS = d.ageS; S.botAt = Date.now(); drawBot(); });
  es.addEventListener("tasks", e => { S.tasks = JSON.parse(e.data); drawTasks(); });
  es.addEventListener("beat", e => { const d = JSON.parse(e.data); S.uptimeS = d.uptimeS; S.uptimeAt = Date.now(); S.bot.counts = d.counts; S.bot.ageS = d.ageS; S.botAt = Date.now(); drawBot(); });
} else {
  S.link = "poll";
  const poll = async () => { try { applySnapshot(await (await fetch("/api/status", { cache: "no-store" })).json()); } catch { /* next round */ } };
  poll(); setInterval(poll, 1500);
}
setInterval(localTick, 1000);
localTick();
</script>
</body>
</html>
